# Checks on every push: types, lint, the evals that need no keys, and a scan
# for secrets. The photo evals (E1, E2, E3, E6) need Gemini credentials, which
# CI does not have, so they report "skip" here; the money, day and audit evals
# (E4, E5, E7) run in full.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Evals that need no keys (E4 money, E5 days, E7 audit)
        run: npm run eval

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
